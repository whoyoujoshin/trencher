name: land-profit-loop-p0
on:
  push:
    branches: [feat/profit-loop-p0]
    paths:
      - "scripts/land-part-*.txt"
      - ".github/workflows/land-profit-loop-p0.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profit-loop-p0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble land script
        run: |
          cat scripts/land-part-0.txt scripts/land-part-1.txt scripts/land-part-2.txt scripts/land-part-3.txt > scripts/land-profit-loop-p0.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = bytearray(Path("scripts/land-profit-loop-p0.mjs").read_bytes())
          assert len(p) == 25989, len(p)
          if p[5001] == ord("p"): p[5001] = ord("d")
          if p[21022] == ord("+"): p[21022] = ord("8")
          assert p[5001] == ord("d") and p[21022] == ord("8"), (p[5001], p[21022])
          Path("scripts/land-profit-loop-p0.mjs").write_bytes(p)
          print("byte-patched land script OK")
          # Patch was generated against tip store with a leading blank line.
          store = Path("src/lib/trench/store.ts")
          b = store.read_bytes()
          if not b.startswith(b"\n"):
              store.write_bytes(b"\n" + b)
              print("prepended leading newline to store.ts for patch baseline")
          PY
      - name: Expand logic + patch store
        run: node scripts/land-profit-loop-p0.mjs
      - name: Commit landed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/trench/logic.ts src/lib/trench/store.ts
          git add -u src/lib/trench/logic-core.ts src/lib/trench/logic-tail.ts src/lib/trench/.profit-loop-marker || true
          git add scripts/land-profit-loop-p0.mjs || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "feat(trench): land profit-loop P0 logic + SHADOW store (expanded)"
            git push
          fi
