name: sniper-arm-wake
on:
  push:
    branches: [fix/sniper-arm-wake]
    paths:
      - "scripts/.sniper-arm-wake-trigger"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sniper-arm-wake
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert SNIPER armed log and remove this scaffolding
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/lib/trench/store.ts")
          t = p.read_text()
          needle = '          log("RISK", "sys", "no entry without a written exit. stops only tighten.");'
          insert = '          log("SNIPER", "sys", "armed. waiting on warden + tape. never averages.");\n'
          marker = "armed. waiting on warden + tape. never averages."
          if marker in t:
              print("already patched")
          elif needle not in t:
              raise SystemExit("needle missing in store.ts")
          else:
              p.write_text(t.replace(needle, insert + needle, 1))
              print("patched store.ts")
          PY
          rm -f scripts/.sniper-arm-wake-trigger
          rm -f scripts/.sniper-arm-wake-note
          rm -f .github/workflows/sniper-arm-wake.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/trench/store.ts scripts .github/workflows || true
          git status
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(trench): Sniper announces armed on arm/killClone"
          git push
